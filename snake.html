<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
  }
  .game-container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    color: #fff;
  }
  .score-box {
    background: rgba(255,255,255,0.1);
    padding: 8px 20px;
    border-radius: 12px;
    font-size: 18px;
  }
  .score-box span { color: #00ff88; font-weight: bold; font-size: 24px; }
  canvas {
    display: block;
    margin: 0 auto;
    border-radius: 12px;
    background: rgba(0,0,0,0.4);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 10px 28px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
  .btn-restart { background: rgba(255,50,50,0.3); border-color: #ff4444; }
  .btn-restart:hover { background: rgba(255,50,50,0.5); }
  .hint {
    color: rgba(255,255,255,0.4);
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
  }
  @media (max-width: 500px) {
    .game-container { padding: 15px; }
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <div style="font-size:22px;font-weight:bold;">🐍 贪吃蛇</div>
    <div class="score-box">分数 <span id="score">0</span></div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">
    <button class="btn" onclick="togglePause()">⏸ 暂停</button>
    <button class="btn btn-restart" onclick="resetGame()">🔄 重新开始</button>
  </div>
  <div class="hint">⬆⬇⬅➡ 方向键控制移动</div>
</div>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');

  const GRID_SIZE = 20;
  const CELL_SIZE = canvas.width / GRID_SIZE;

  let snake, direction, nextDirection, food, score, gameOver, paused;
  let gameLoop;

  function init() {
    snake = [{x: 10, y: 10}];
    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};
    score = 0;
    gameOver = false;
    paused = false;
    scoreEl.textContent = '0';
    spawnFood();
  }

  function spawnFood() {
    do {
      food = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制网格
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL_SIZE, 0);
      ctx.lineTo(i * CELL_SIZE, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL_SIZE);
      ctx.lineTo(canvas.width, i * CELL_SIZE);
      ctx.stroke();
    }

    // 绘制食物
    const fx = food.x * CELL_SIZE, fy = food.y * CELL_SIZE;
    const gradient = ctx.createRadialGradient(fx+5, fy+5, 2, fx+CELL_SIZE/2, fy+CELL_SIZE/2, CELL_SIZE/1.5);
    gradient.addColorStop(0, '#ff6666');
    gradient.addColorStop(1, '#cc0000');
    ctx.fillStyle = gradient;
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(fx + CELL_SIZE/2, fy + CELL_SIZE/2, CELL_SIZE/2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 绘制蛇
    snake.forEach((segment, i) => {
      const sx = segment.x * CELL_SIZE, sy = segment.y * CELL_SIZE;
      const padding = 1;
      const ratio = 1 - (i / snake.length) * 0.5;
      const r = Math.round(0 + ratio * 0);
      const g = Math.round(180 + ratio * 75);
      const b = Math.round(50 + ratio * 50);
      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      if (i === 0) {
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 8;
      }
      ctx.beginPath();
      ctx.roundRect(sx + padding, sy + padding, CELL_SIZE - padding*2, CELL_SIZE - padding*2, i === 0 ? 6 : 4);
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Game over 遮罩
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('💀 游戏结束', canvas.width/2, canvas.height/2 - 10);
      ctx.font = '18px sans-serif';
      ctx.fillStyle = '#aaa';
      ctx.fillText('点击"重新开始"再来一局', canvas.width/2, canvas.height/2 + 40);
    } else if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⏸ 已暂停', canvas.width/2, canvas.height/2);
    }
  }

  function update() {
    if (gameOver || paused) return;

    direction = {...nextDirection};
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

    // 撞墙检测
    if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
      gameOver = true;
      return;
    }

    // 撞自身检测
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver = true;
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function gameTick() {
    update();
    draw();
  }

  function togglePause() {
    if (gameOver) return;
    paused = !paused;
  }

  function resetGame() {
    clearInterval(gameLoop);
    init();
    gameLoop = setInterval(gameTick, 120);
  }

  // roundRect polyfill
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (r > w/2) r = w/2;
      if (r > h/2) r = h/2;
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      this.closePath();
    };
  }

  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp':    if (direction.y === 0) nextDirection = {x: 0, y: -1}; break;
      case 'ArrowDown':  if (direction.y === 0) nextDirection = {x: 0, y: 1}; break;
      case 'ArrowLeft':  if (direction.x === 0) nextDirection = {x: -1, y: 0}; break;
      case 'ArrowRight': if (direction.x === 0) nextDirection = {x: 1, y: 0}; break;
      case ' ': e.preventDefault(); togglePause(); break;
    }
  });

  // 触摸滑动支持
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  });
  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 15 && direction.x === 0) nextDirection = {x: 1, y: 0};
      if (dx < -15 && direction.x === 0) nextDirection = {x: -1, y: 0};
    } else {
      if (dy > 15 && direction.y === 0) nextDirection = {x: 0, y: 1};
      if (dy < -15 && direction.y === 0) nextDirection = {x: 0, y: -1};
    }
  });

  init();
  gameLoop = setInterval(gameTick, 120);
</script>
</body>
</html>
